# Production Docker Compose - Frontend & Backend in Separate Pods
# For deployment to cloud (AWS, DigitalOcean, etc.)
# 
# This docker-compose.yml is for PRODUCTION deployment only

version: '3.8'

services:
  # ========================================
  # OPTIONAL REDIS (FUTURE ENABLEMENT)
  # ========================================
  # Uncomment this service and backend env/depends_on notes below
  # if you reintroduce Redis pub/sub or cache.
  # redis:
  #   image: redis:7-alpine
  #   container_name: event-bus-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - app-network
  #   restart: always

  # ========================================
  # MYSQL DATABASE
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: app-database
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-employee_management}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: always

  # ========================================
  # BACKEND API (Pod 2)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-api-backend
    ports:
      - "5000:5000"
    depends_on:
      # Optional future Redis dependency:
      # redis:
      #   condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: "mysql://${DB_USER:-app_user}:${DB_PASSWORD:-app_password}@mysql:3306/${DB_NAME:-employee_management}"

      # Optional future Redis config:
      # REDIS_HOST: redis
      # REDIS_PORT: 6379
      # REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this}
      JWT_EXPIRES_IN: "24h"
      
      # Server
      PORT: 5000
      NODE_ENV: production
      
      # Frontend URL (for CORS)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend/src:/app/src
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================
  # FRONTEND (Pod 1)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-portal-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Backend API URL (inside Docker network)
      VITE_API_URL: ${API_URL:-http://backend:5000}
      
      # Frontend port
      FRONTEND_PORT: 3000
      
      NODE_ENV: production
    volumes:
      - ./frontend/src:/app/src
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

# ========================================
# NETWORKS
# ========================================
networks:
  app-network:
    driver: bridge

# ========================================
# VOLUMES
# ========================================
volumes:
  # Optional future Redis volume:
  # redis_data:
  #   driver: local
  mysql_data:
    driver: local

# ========================================
# COMPOSE OVERRIDE FOR LOCAL DEVELOPMENT
# ========================================
# To use this for local development:
# 1. Comment out the 'depends_on' sections
# 2. Remove health checks
# 3. Use docker-compose -f docker-compose.yml -f docker-compose.local.yml up
